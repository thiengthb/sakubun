# Local deploy of the SINGLE-USER sakubun. `docker compose up -d --build` once; the container then
# starts with Docker (restart: unless-stopped). Data lives in the named volume below — deleting the
# container keeps your study history.
#
# Public access rides docker-compose.tunnel.yml (Cloudflare Tunnel → sakubun.thientnse.site).
services:
  sakubun:
    build: .
    image: sakubun:local
    container_name: sakubun
    ports:
      - '3789:3789'
    volumes:
      - sakubun_data:/data
    # Auth secrets: BETTER_AUTH_SECRET, BETTER_AUTH_URL và cặp GOOGLE_*. Cố ý KHÔNG có DATABASE_URL
    # để giá trị file:/data/sakubun.db trong image thắng.
    #
    # Cặp GOOGLE_* ở đây KHÔNG phải tuỳ chọn: tài khoản duy nhất đăng nhập bằng Google và không có
    # dòng password, nên thiếu hai biến đó thì better-auth bỏ provider và KHÔNG CÒN đường vào.
    #
    # Trỏ THẲNG sang bản trong fleet thay vì giữ một bản copy thứ hai ở đây:
    #   1. Một nguồn sự thật cho secret — đổi khoá ở một chỗ, không lệch giữa hai bản.
    #   2. Container 3789 vốn chạy từ fleet, nên đây đúng là file nó đang dùng.
    # Muốn project này độc lập với fleet thì copy file về và đổi lại thành `.env.docker`.
    env_file:
      - ../fleet/projects/sakubun/.env.docker
    environment:
      # Local VOICEVOX engine (neural JA TTS) reached over the compose network by /api/tts. If it is
      # down the client falls back to browser Web Speech, so this is best-effort, not required.
      - VOICEVOX_URL=http://voicevox:50021
    depends_on:
      - voicevox
    restart: unless-stopped

  # Neural Japanese TTS engine (VOICEVOX, local + free). NOT exposed to the host — only sakubun
  # reaches it over the compose network. CPU build, pinned; third-party image → bump the tag manually.
  voicevox:
    image: voicevox/voicevox_engine:cpu-0.21.0
    container_name: sakubun-voicevox
    restart: unless-stopped

volumes:
  # Name PINNED to the volume that actually exists on this host (verified with `docker volume ls`).
  # Compose prefixes a named volume with the project name, so the declaration `sakubun_data` has
  # always produced `sakubun_sakubun_data` on disk.
  # ⚠ DO NOT "correct" this to `sakubun_data` — that binds a DIFFERENT, EMPTY volume and the app comes
  # up with no study history.
  sakubun_data:
    name: sakubun_sakubun_data
