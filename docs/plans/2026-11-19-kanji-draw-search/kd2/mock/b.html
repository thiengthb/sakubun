<!doctype html><meta charset="utf-8"><style>
/* Sketch shell for KD2: laptop frame beside two phone frames (before drawing and while drawing). Not app code. */
:root{--bg:#f6f3ee;--card:#fffdf9;--line:#e7e0d4;--ink:#24201b;--mute:#7b7368;--brand:#c9592f;--brand-soft:#f3d9cc;
--ok:#1f7a4d;--ok-soft:#d5ebdd;--learn:#d9884f;--learn-soft:#f6e0cc;--due:#b8860b;--due-soft:#f6ebc6;--new:#9aa3ad;--new-soft:#e7eaee;}
*{box-sizing:border-box;margin:0}
body{background:#ebe6dd;font:15px/1.45 "Noto Sans","Noto Sans CJK JP",system-ui,sans-serif;color:var(--ink);width:2414px;height:990px;
display:flex;gap:24px;padding:28px;}
.laptop{width:1530px;height:934px;background:var(--bg);border-radius:14px;display:flex;overflow:hidden;box-shadow:0 2px 10px #0001}
.side{width:240px;flex:none;background:#efebe4;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}.logo{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.side .g{color:var(--mute);font-size:12px;margin:14px 6px 4px}.side .i{padding:7px 10px;border-radius:8px}.side .i.on{background:#fff;color:var(--brand);border:1px solid var(--line)}
.main{flex:1;padding:26px 34px;overflow:hidden}
.phone{width:390px;height:934px;background:var(--bg);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 2px 10px #0001}
.phone .main{padding:16px 16px 90px}
.tabs{position:absolute;left:0;right:0;bottom:0;height:68px;background:#fffdf9;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--mute)}
.tabs span.on{color:var(--brand);font-weight:600}
.crumb{color:var(--brand);font-size:13px;margin-bottom:6px}
h1{font-size:30px;line-height:1.15;font-weight:700}.phone h1{font-size:24px}
.meta{color:var(--mute);font-size:13px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#ece6dc}.bar i{display:block;height:100%}
.ok{color:var(--ok)}.learn{color:var(--learn)}.due{color:var(--due)}.mute{color:var(--mute)}
.jp{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.note{position:absolute;right:10px;top:8px;font-size:11px;color:var(--mute)}
.dots{display:flex;flex-wrap:wrap;gap:4px}.dots i{width:12px;height:12px;border-radius:3px}
.d-ok{background:var(--ok)}.d-learn{background:var(--learn)}.d-due{background:var(--due)}.d-new{background:#cfd5dc}
.dim{position:absolute;inset:0;background:#24201b55}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px 24px;box-shadow:0 -4px 20px #0002}
.grab{width:40px;height:5px;border-radius:9px;background:#d8d0c4;margin:0 auto 12px}
.way{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.way .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.way b{display:block;font-size:15px}.way span.s{font-size:13px;color:var(--mute)}
.tab{padding:7px 12px;border-radius:99px;font-size:14px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:12px;color:var(--mute);font-weight:600}
.src{font-size:12px;color:var(--mute)}
.inp{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;font-size:14px;color:var(--mute)}
.lv{padding:14px 18px;display:flex;flex-direction:column;gap:8px}.lv h3{font-size:18px}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cell{font-size:13px;color:var(--mute)}.cell b{display:block;color:var(--ink);font-size:14px}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:9px 12px;font-size:15px}
.search.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.res{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}.res:last-child{border:0}
.res .e{font-size:17px;font-weight:600}.res .m{font-size:13px;color:var(--mute)}
.lvl{font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.hd{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:15px;margin:14px 0 6px}.hd .c{font-weight:400;color:var(--mute);font-size:13px}
.pop{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0003;padding:6px 8px 10px}
.seg{display:flex;border-bottom:1px solid var(--line);gap:18px;font-size:14px}.seg span{padding:8px 2px}.seg span.on{border-bottom:2.5px solid var(--brand);font-weight:700}
mark{background:#f9e3a8;color:inherit;border-radius:3px;padding:0 1px}
.pad{background:#fff;border:1.5px solid var(--line);border-radius:12px;position:relative;aspect-ratio:1/1}
.pad svg{position:absolute;inset:0;width:100%;height:100%}
.padtools{display:flex;gap:8px;align-items:center}
.cand{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.cand span{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:24px}
.cand span.top{border-color:var(--brand);background:var(--brand-soft)}
.pen{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px}
.pen.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{font-size:12px;color:var(--mute)}
</style><body><script>
const KAI = `<path d="M52.25,14c0.25,2.28-0.52,3.59-1.8,5.62c-5.76,9.14-17.9,27-39.2,39.88"/><path d="M54.5,19.25c6.73,7.3,24.09,24.81,32.95,31.91c2.73,2.18,5.61,3.8,9.05,4.59"/><path d="M37.36,50.16c1.64,0.34,4.04,0.36,4.98,0.25c6.79-0.79,14.29-1.91,19.66-2.4c1.56-0.14,3.25-0.39,4.66,0"/><path d="M23,65.98c2.12,0.52,4.25,0.64,7.01,0.3c13.77-1.71,30.99-3.66,46.35-3.74c3.04-0.02,4.87,0.14,6.4,0.29"/><path d="M47.16,66.38c0.62,1.65-0.03,2.93-0.92,4.28c-5.17,7.8-8.02,11.38-14.99,18.84c-2.11,2.25-1.5,4.18,2,3.75c7.35-0.91,28.19-5.83,40.16-7.95"/><path d="M66.62,77.39c4.52,3.23,11,12.73,13.06,18.82"/>`;
const SIDE = `<div class="side"><div class="brand"><div class="logo">作文</div><div><b>Sakubun</b><div class="meta" style="margin:0">Luyện dịch Nhật–Việt</div></div></div>
<div class="g">Học</div><div class="i">Hôm nay</div><div class="i">Ôn nhanh</div><div class="i">Hội thoại</div>
<div class="g">Kho</div><div class="i on">Kho</div><div class="g">Bạn</div><div class="i">Tiến độ</div><div class="i">Phân tích</div><div class="i">Cài đặt</div></div>`;
const TABS = `<div class="tabs" style="z-index:3"><span>Hôm nay</span><span>Ôn nhanh</span><span>Hội thoại</span><span class="on">Kho</span><span>Bạn</span></div>`;
const LABEL = {ok:'Đã thuộc',learn:'Đang học',due:'Đến hạn',new:'Chưa học'};
const pill = s => `<span class="pill" style="background:var(--${s==='new'?'new':s}-soft);color:var(--${s==='new'?'mute':s})">${LABEL[s]}</span>`;
const hl = e => e.replace('社','<mark>社</mark>');
const MINE = [['社会','しゃかい','xã hội','N4','learn'],['会社','かいしゃ','công ty','N5','ok'],['神社','じんじゃ','đền thần đạo','N4','due']];
const LIB = [['社長','しゃちょう','giám đốc','N4'],['社員','しゃいん','nhân viên công ty','N4'],['本社','ほんしゃ','trụ sở chính','N3'],['入社','にゅうしゃ','vào công ty','N3']];
const mine = r => `<div class="res"><div style="flex:1;min-width:0"><span class="e jp">${hl(r[0])}</span> <span class="m jp">${r[1]}</span><div class="m">${r[2]}</div></div><span class="lvl">${r[3]}</span>${pill(r[4])}</div>`;
const lib = r => `<div class="res"><div style="flex:1;min-width:0"><span class="e jp">${hl(r[0])}</span> <span class="m jp">${r[1]}</span><div class="m">${r[2]}</div></div><span class="lvl">${r[3]}</span><span class="btn" style="padding:5px 12px">Học</span></div>`;
const LEVELS = [['N5','312 / 680 từ · 41 / 92 mẫu','ok'],['N4','120 / 590 từ · 18 / 130 mẫu','learn'],['N3','64 / 1780 từ · 6 / 180 mẫu','learn'],['N2','0 / 1830 từ · 0 / 190 mẫu','new'],['N1','0 / 3470 từ · 0 / 250 mẫu','new']];
const level = l => `<div class="card lv"><div class="row"><h3>${l[0]}</h3><span class="sp"></span><span class="mute" style="font-size:13px">${l[1]}</span></div><div class="bar"><i style="width:${l[2]==='ok'?46:l[2]==='learn'?18:0}%;background:var(--ok)"></i><i style="width:8%;background:var(--learn)"></i></div></div>`;
const head = phone => `<div class="crumb" style="visibility:hidden">.</div><div class="row"><h1>Kho</h1><span class="sp"></span>${phone?'':'<span class="btn">Mọi mục</span>'}<span class="btn pri">+ Thêm</span></div><div class="meta">Từ, mẫu và kanji của bạn theo cấp JLPT</div>`;
const board = () => LEVELS.map(level).join('<div style="height:10px"></div>');
// The box: what is typed so far, and the pen that opens the pad.
const box = (text, penOn) => `<div class="search ${text||penOn?'on':''}" style="margin-top:14px">⌕ <span class="${text?'jp':'mute'}" style="flex:1">${text||'Tìm trong kho và Kho chung'}</span>${text?'<span class="mute">✕</span>':''}<span class="pen ${penOn?'on':''}" title="Vẽ chữ">✎</span></div>`;
const colMine = n => `<div><div class="hd">Trong kho của bạn <span class="c">3 mục</span></div><div class="card">${MINE.slice(0,n).map(mine).join('')}</div></div>`;
const colLib = n => `<div><div class="hd">Trong Kho chung <span class="c">24 mục chưa có trong kho</span></div><div class="card">${LIB.slice(0,n).map(lib).join('')}<div class="res"><span class="sp"></span><span style="color:var(--brand);font-weight:600;font-size:14px">Xem thêm 20 mục</span></div></div></div>`;
// The pad, with 会 drawn after 社 was picked; the guesses for it underneath.
const strokes = `<svg viewBox="0 0 109 109"><path d="M54.5 6v97M6 54.5h97" stroke="#e7e0d4" stroke-dasharray="3 3" fill="none"/><g fill="none" stroke="#24201b" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 1) rotate(-1.5 54 54)">${KAI}</g></svg>`;
const GUESS = ['会','合','今','全','金','令','企','介','舎','余'];
const guesses = n => `<div class="cand jp">${GUESS.slice(0,n).map((g,i)=>`<span class="${i?'':'top'}">${g}</span>`).join('')}</div>`;
const tools = `<div class="padtools"><span class="btn" style="padding:6px 10px">↶ Xoá nét</span><span class="btn" style="padding:6px 10px">Xoá hết</span><span class="sp"></span><span class="hint">Bấm chữ đúng để thêm vào ô tìm</span></div>`;

// B: the pen turns the bottom of the screen into a drawing keyboard (phone); on a laptop it is a
// column beside the results. The results stay in view while drawing.
const keyboard = `<div style="position:absolute;left:0;right:0;bottom:0;background:#efebe4;border-top:1px solid var(--line);padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px;z-index:4">${guesses(7)}<div style="display:flex;gap:10px"><div class="pad" style="width:250px">${strokes}</div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><span class="btn">↶ Xoá nét</span><span class="btn">Xoá hết</span><span class="btn">Bàn phím</span></div></div></div>`;
function laptop(){return head(false)+box('社',true)+`<div style="display:grid;grid-template-columns:1fr 360px;gap:20px;margin-top:4px"><div>${colMine(3)}${colLib(4)}</div><div><div class="hd">Vẽ chữ <span class="c">nét theo thứ tự càng tốt</span></div><div class="card" style="padding:12px;display:flex;flex-direction:column;gap:10px">${guesses(6)}<div class="pad">${strokes}</div>${tools.replace('<span class="hint">Bấm chữ đúng để thêm vào ô tìm</span>','')}</div></div></div>`}
function before(){return head(true)+box('',false)+`<div style="margin-top:12px">${board()}</div>`}
function drawing(){return head(true)+box('社',true)+colMine(2)+keyboard}

document.body.insertAdjacentHTML("beforeend", `<div class="laptop">${SIDE}<div class="main" style="position:relative">${laptop()}</div></div><div class="phone"><div class="main" style="position:relative;height:100%">${before()}</div>${TABS}</div><div class="phone"><div class="main" style="position:relative;height:100%">${drawing()}</div>${TABS}</div>`);
</script>
