<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><body>
<style>
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wrap{display:flex;gap:18px;margin-top:14px}
.grid{flex:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-content:start}
.tile{height:58px;border-radius:9px;display:grid;place-items:center;font-size:17px;font-weight:600}
.t-ok{background:var(--ok-soft);color:#174f33}.t-learn{background:var(--learn-soft);color:#7a4115}.t-due{background:var(--due-soft);color:#6b4e00;box-shadow:inset 0 0 0 2px var(--due)}.t-new{background:#fff;border:1px solid var(--line)}.t-none{border:1.5px dashed #c9c1b4;color:#b2a998;font-weight:400}
.tile.sel{outline:3px solid var(--brand);outline-offset:2px}
.panel{width:360px;flex:none;padding:20px;display:flex;flex-direction:column;gap:10px;align-self:start}
.big{font-size:52px;font-weight:700;line-height:1}
.phone .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.phone .tile{height:54px;font-size:15px}
.sheet{position:absolute;left:0;right:0;bottom:68px;background:#fffdf9;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 20px #0002;padding:10px 16px 16px}
.grab{width:40px;height:4px;border-radius:9px;background:#d6cfc3;margin:0 auto 10px}
.ex{background:#f3efe8;border-radius:10px;padding:10px 12px;font-size:14px}
</style>
<script>
const legend=on=>`<div class="legend">${[['ok','Đã thuộc 52','var(--ok)'],['learn','Đang học 38','var(--learn)'],['due','Đến hạn 6','var(--due)'],['new','Chưa học 540','#cfd5dc'],['none','Chưa có 26','transparent;border:1.5px dashed #b9b0a2']].map(([k,t,c])=>`<span class="lg"><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const tiles=(n)=>W.slice(0,n).map((w,i)=>`<div class="tile t-${ST[i]} jp${i===6?' sel':''}">${w[0]}</div>`).join('');
const detail=`<div class="row"><span class="pill" style="background:var(--due-soft);color:#6b4e00">Đến hạn hôm nay</span><span class="sp"></span><span class="mute" style="font-size:13px">Chặng 1 · từ 7/662</span></div>
<div class="row" style="align-items:flex-end"><div class="big jp">秋</div><div><div class="jp" style="font-size:18px">あき</div><div class="mute" style="font-size:13px">THU</div></div></div>
<div style="font-size:18px;font-weight:600">mùa thu</div>
<div class="ex jp">秋は涼しくて気持ちがいいです。<div class="mute" style="font-family:inherit">Mùa thu mát mẻ, dễ chịu.</div></div>
<div class="mute" style="font-size:13px">Ôn 5 lần · quên 1 lần · lần tới: hôm nay</div>`;
function laptop(){return `<div class="crumb">Kho › N5</div><div class="row"><div><h1>N5 · Từ vựng</h1><div class="meta">Mỗi ô là một từ · màu là trạng thái · bấm ô để xem, bấm chú thích để lọc</div></div><span class="sp"></span><span class="btn">Tìm trong N5</span><span class="btn">+ Lấy nốt 26 từ</span></div>
${legend()}<div class="wrap"><div class="grid">${tiles(48)}${'<div class="tile t-new jp">…</div>'.repeat(2)}</div>
<div class="card panel">${detail}<div class="row" style="margin-top:6px"><span class="btn">Nghe</span><span class="sp"></span><span class="btn pri">Ôn từ này</span></div></div></div>`}
function phone(){return `<div class="crumb">Kho › N5</div><div class="row"><h1>N5 · Từ vựng</h1><span class="sp"></span><span class="btn">Tìm</span></div>
<div style="overflow:hidden;white-space:nowrap">${legend()}</div><div class="grid" style="margin-top:12px">${tiles(30)}</div>
<div class="sheet"><div class="grab"></div><div class="row"><div class="big jp" style="font-size:40px">秋</div><div><div class="jp">あき · <span class="mute">THU</span></div><div style="font-weight:600">mùa thu</div></div><span class="sp"></span><span class="pill" style="background:var(--due-soft);color:#6b4e00">Đến hạn</span></div>
<div class="row" style="margin-top:10px"><span class="btn" style="flex:1;justify-content:center">Nghe</span><span class="btn pri" style="flex:1;justify-content:center">Ôn từ này</span></div></div>`}
</script><script src="shell.js"></script>
