<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{display:flex;gap:18px;margin-top:14px}
.grid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-content:start}
.tile{height:84px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:600;gap:2px}
.tile small{font-size:12px;font-weight:400;color:var(--mute)}
.t-ok{background:var(--ok-soft);color:#174f33}.t-learn{background:var(--learn-soft);color:#7a4115}.t-due{background:var(--due-soft);color:#6b4e00;box-shadow:inset 0 0 0 2px var(--due)}.t-new{background:#fff;border:1px solid var(--line)}.t-none{border:1.5px dashed #c9c1b4;color:#b2a998;font-weight:400}
.tile.sel{outline:3px solid var(--brand);outline-offset:2px}
.panel{width:380px;flex:none;padding:20px;display:flex;flex-direction:column;gap:10px;align-self:start}
.big{font-size:56px;font-weight:700;line-height:1}
.ex{background:#f3efe8;border-radius:10px;padding:10px 12px;font-size:14px}
.phone .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.phone .tile{height:64px;font-size:16px}.phone .tile small{display:none}
.sheet{position:absolute;left:0;right:0;bottom:68px;background:#fffdf9;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 20px #0002;padding:10px 16px 16px}
.grab{width:40px;height:4px;border-radius:9px;background:#d6cfc3;margin:0 auto 10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-right:12px;white-space:nowrap}.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tag{font-size:11px;font-weight:700;color:#fff;background:#6b5bd2;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
</style><body>
<script>
const IDX=[...Array(20).keys()].map(i=>i+20);
const S2=['ok','ok','learn','due','ok','learn','due','learn','new','ok','learn','due','ok','ok','learn','ok','new','learn','new','new'];
const tiles=(sm)=>IDX.map((i,k)=>`<div class="tile t-${S2[k]} jp${k===3?' sel':''}">${W[i][0]}${sm?`<small>${W[i][2]}</small>`:''}</div>`).join('');
const legend=`<div style="margin-top:10px">${[['var(--ok)','Thuộc 7'],['var(--learn)','Đang học 6'],['var(--due)','Đến hạn 3'],['#cfd5dc','Chưa học 4']].map(([c,t])=>`<span class="lg"><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
const ww=()=>W[23];
function laptop(){const w=ww();return `<div class="crumb">Kho › N5 › Chặng 2</div><div class="row"><div><h1>Chặng 2 <span class="mute jp" style="font-size:20px;font-weight:400">${W[20][0]} → ${W[39][0]}</span><span class="tag">B</span></h1><div class="meta">20 từ · 7 thuộc · 3 đến hạn · 4 chưa học</div></div><span class="sp"></span><span class="btn">‹ Chặng 1</span><span class="btn">Chặng 3 ›</span><span class="btn">Ôn 3 từ</span><span class="btn pri">Học 4 từ mới</span></div>
${legend}<div class="wrap"><div class="grid">${tiles(true)}</div>
<div class="card panel"><div class="row"><span class="pill" style="background:var(--due-soft);color:#6b4e00">Đến hạn hôm nay</span><span class="sp"></span><span class="mute" style="font-size:13px">quên 3 lần</span></div>
<div class="row" style="align-items:flex-end"><div class="big jp">${w[0]}</div><div><div class="jp" style="font-size:18px">${w[1]}</div><div class="mute" style="font-size:13px">HẬU</div></div></div>
<div style="font-size:18px;font-weight:600">${w[2]}</div><div class="ex jp">この本は厚いです。<div class="mute">Quyển sách này dày.</div></div>
<div class="row"><span class="btn">Nghe</span><span class="sp"></span><span class="btn pri">Ôn từ này</span></div></div></div>`}
function phone(){const w=ww();return `<div class="crumb">Kho › N5 › Chặng 2</div><div class="row"><h1>Chặng 2</h1><span class="sp"></span><span class="btn pri">Học 4</span></div><div class="meta">7 thuộc · 3 đến hạn · 4 chưa học</div>
<div style="white-space:nowrap;overflow:hidden">${legend}</div><div class="grid" style="margin-top:10px">${tiles(false)}</div>
<div class="sheet"><div class="grab"></div><div class="row"><div class="big jp" style="font-size:40px">${w[0]}</div><div><div class="jp">${w[1]} · <span class="mute">HẬU</span></div><div style="font-weight:600">${w[2]}</div></div><span class="sp"></span><span class="pill" style="background:var(--due-soft);color:#6b4e00">Đến hạn</span></div>
<div class="row" style="margin-top:10px"><span class="btn" style="flex:1;justify-content:center">Nghe</span><span class="btn pri" style="flex:1;justify-content:center">Ôn từ này</span></div></div>`}
</script><script src="shell.js"></script>
