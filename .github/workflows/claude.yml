# Claude on GitHub, only when someone with write access comments "@claude ..." on an issue or PR
# (thienai-workflow profile/REVIEW.md, decision 003). No automatic runs, so no Actions minutes are spent unless called.
# Needs: the Claude GitHub App installed on this repo, and the secret CLAUDE_CODE_OAUTH_TOKEN
# (run `claude setup-token` on the laptop with any Claude nick; runs count against that nick's usage).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 30'
