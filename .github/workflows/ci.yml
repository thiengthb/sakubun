name: ci  # deploy.yml runs on workflow_run of this name: renaming it stops deploys silently

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Hosted only: the repo is public, so never a self-hosted runner (docs/ci-runner.md).
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:/tmp/ci.db
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3789
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The runtime image has its own locked Prisma CLI dependency tree; compile it on every
      # PR so Dockerfile/package-lock drift cannot reach GHCR or the miniserver.
      - run: docker build --pull --tag sakubun:ci .
