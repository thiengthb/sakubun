# .github/workflows/deploy.yml in an app repo: build on GitHub, push to ghcr. miniserver pulls it within ~2 minutes.
# Builds only after `ci` passed on main, from the exact commit CI tested (nuc-infra F-09, M2 step 6).
# To rebuild a commit, re-run its `ci` run.
name: build-and-push
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Pin every third-party action to a full commit SHA.  Tags are mutable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          tags: |
            ghcr.io/${{ github.repository }}-app:latest
            ghcr.io/${{ github.repository }}-app:sha-${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
